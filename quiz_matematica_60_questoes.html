<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Matemática - 30 Questões</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#172554,#2563eb);min-height:100vh;color:#172033}
.container{max-width:850px;margin:auto;padding:22px}
.card{background:white;border-radius:20px;padding:28px;box-shadow:0 12px 35px #0005}
h1{text-align:center;margin:0 0 8px;color:#1d4ed8}
.subtitle{text-align:center;color:#64748b;margin-bottom:22px}
.progress{height:12px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:20px}
.bar{height:100%;background:#2563eb;width:0%;transition:.3s}
.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:7px 12px;border-radius:20px;font-weight:bold;margin-bottom:12px}
.question{font-size:22px;font-weight:bold;line-height:1.4;margin:10px 0 22px}
.option{display:block;width:100%;text-align:left;padding:15px;margin:10px 0;border:2px solid #cbd5e1;background:#f8fafc;border-radius:12px;font-size:17px;cursor:pointer;transition:.2s}
.option:hover{border-color:#2563eb;background:#eff6ff}
.option.selected{border-color:#2563eb;background:#dbeafe}
button.next{width:100%;padding:15px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:18px;font-weight:bold;margin-top:12px;cursor:pointer}
button.next:disabled{background:#94a3b8;cursor:not-allowed}
.result{text-align:center}
.score{font-size:52px;font-weight:bold;color:#2563eb}
.review{text-align:left;margin-top:25px}
.review-item{padding:13px;margin:10px 0;border-radius:10px;background:#f1f5f9}
.correct{border-left:6px solid #16a34a}
.wrong{border-left:6px solid #dc2626}
.restart{background:#16a34a!important}
</style>
</head>
<body>
<div class="container"><div class="card" id="app"></div></div>
<script>
const questions=[
["Aritmética","Quanto é 48 ÷ 6 + 7 × 3?","A) 29","B) 31","C) 35","D) 45","B"],
["Aritmética","Qual é o resultado de 3/4 + 2/3?","A) 5/7","B) 13/12","C) 17/12","D) 19/12","C"],
["Aritmética","Um produto de R$ 200,00 recebeu desconto de 15%. Qual foi o preço final?","A) R$ 165,00","B) R$ 170,00","C) R$ 175,00","D) R$ 185,00","B"],
["Aritmética","Qual é o MMC de 12 e 18?","A) 24","B) 30","C) 36","D) 54","C"],
["Aritmética","Qual é a média aritmética de 6, 8, 10 e 12?","A) 8","B) 9","C) 10","D) 11","B"],
["Aritmética","Uma sequência começa em 5 e aumenta 4 unidades a cada termo. Qual é o 8º termo?","A) 29","B) 31","C) 33","D) 37","B"],
["Aritmética","Qual é 25% de 360?","A) 75","B) 80","C) 90","D) 100","C"],
["Aritmética","Qual é o resultado de 2⁵ + 3²?","A) 35","B) 39","C) 41","D) 43","B"],
["Álgebra","Resolva: 3x + 7 = 25.","A) x = 4","B) x = 5","C) x = 6","D) x = 7","C"],
["Álgebra","Qual expressão é equivalente a 4(x + 3) − 2x?","A) 2x + 12","B) 2x + 6","C) 6x + 12","D) 4x + 10","A"],
["Álgebra","Se x = 3 e y = 5, qual é o valor de 2x + 3y?","A) 18","B) 19","C) 21","D) 23","C"],
["Álgebra","As raízes de x² − 5x + 6 = 0 são:","A) 1 e 6","B) 2 e 3","C) −2 e −3","D) 3 e 4","B"],
["Álgebra","Qual é o valor de x em 2(x − 4) = 14?","A) 7","B) 9","C) 11","D) 12","B"],
["Álgebra","A função f(x) = 2x − 5 tem qual valor para x = 4?","A) 1","B) 2","C) 3","D) 4","C"],
["Álgebra","Qual é a fatoração de x² − 9?","A) (x − 9)(x + 1)","B) (x − 3)²","C) (x − 3)(x + 3)","D) (x + 9)(x − 1)","C"],
["Álgebra","Se 5x = 40, então x é igual a:","A) 6","B) 7","C) 8","D) 9","C"],
["Geometria Plana","Qual é a área de um retângulo de 8 cm por 5 cm?","A) 13 cm²","B) 26 cm²","C) 40 cm²","D) 80 cm²","C"],
["Geometria Plana","Um quadrado possui lado de 7 cm. Qual é seu perímetro?","A) 14 cm","B) 21 cm","C) 28 cm","D) 49 cm","C"],
["Geometria Plana","Qual é a área de um triângulo com base 12 cm e altura 5 cm?","A) 17 cm²","B) 30 cm²","C) 60 cm²","D) 120 cm²","B"],
["Geometria Plana","Considerando π = 3,14, qual é a área de um círculo de raio 5 cm?","A) 31,4 cm²","B) 62,8 cm²","C) 78,5 cm²","D) 157 cm²","C"],
["Geometria Plana","Um triângulo retângulo tem catetos 6 cm e 8 cm. Qual é a medida da hipotenusa?","A) 9 cm","B) 10 cm","C) 12 cm","D) 14 cm","B"],
["Geometria Plana","A soma dos ângulos internos de um quadrilátero é:","A) 180°","B) 270°","C) 360°","D) 540°","C"],
["Geometria Plana","Um trapézio possui bases 10 cm e 6 cm e altura 4 cm. Qual é sua área?","A) 24 cm²","B) 28 cm²","C) 32 cm²","D) 40 cm²","C"],
["Geometria Plana","Qual é o comprimento de uma circunferência de raio 3 cm, usando π = 3,14?","A) 9,42 cm","B) 18,84 cm","C) 28,26 cm","D) 37,68 cm","B"],
["Geometria Espacial","Qual é o volume de um cubo de aresta 4 cm?","A) 16 cm³","B) 32 cm³","C) 64 cm³","D) 96 cm³","C"],
["Geometria Espacial","Qual é o volume de um paralelepípedo com dimensões 5 cm, 3 cm e 2 cm?","A) 10 cm³","B) 20 cm³","C) 30 cm³","D) 60 cm³","C"],
["Geometria Espacial","Um cilindro tem raio 3 cm e altura 10 cm. Usando π = 3,14, seu volume é:","A) 188,4 cm³","B) 282,6 cm³","C) 314 cm³","D) 376,8 cm³","B"],
["Geometria Espacial","Qual é o volume de uma esfera de raio 3 cm, usando π = 3,14?","A) 84,78 cm³","B) 100,48 cm³","C) 113,04 cm³","D) 125,60 cm³","C"],
["Geometria Espacial","Uma pirâmide possui área da base de 20 cm² e altura de 9 cm. Qual é seu volume?","A) 60 cm³","B) 90 cm³","C) 120 cm³","D) 180 cm³","B"],
["Geometria Espacial","Um cone tem raio 3 cm e altura 4 cm. Usando π = 3,14, qual é seu volume?","A) 28,26 cm³","B) 37,68 cm³","C) 56,52 cm³","D) 113,04 cm³","B"]
,["Aritmética","Qual é o resultado de 125 + 378?","A) 493","B) 503","C) 513","D) 523","B"]
,["Aritmética","Qual é o MDC de 24 e 36?","A) 6","B) 8","C) 12","D) 18","C"]
,["Aritmética","Uma camisa custa R$ 80,00 e sofreu aumento de 20%. Qual é o novo preço?","A) R$ 88,00","B) R$ 96,00","C) R$ 100,00","D) R$ 104,00","B"]
,["Aritmética","Qual é o valor de 3,5 + 2,75?","A) 5,25","B) 6,15","C) 6,25","D) 6,35","C"]
,["Aritmética","Em uma turma de 40 alunos, 30% faltaram. Quantos alunos compareceram?","A) 12","B) 28","C) 30","D) 32","B"]
,["Aritmética","Qual é o resultado de 7² − 5²?","A) 12","B) 20","C) 24","D) 30","C"]
,["Aritmética","Um carro percorre 240 km com 20 litros de combustível. Mantendo o mesmo consumo, quantos quilômetros percorrerá com 35 litros?","A) 360 km","B) 400 km","C) 420 km","D) 450 km","C"]
,["Álgebra","Resolva: 5x − 9 = 26.","A) x = 5","B) x = 6","C) x = 7","D) x = 8","C"]
,["Álgebra","Qual é a solução de 4x + 3 = 2x + 15?","A) x = 4","B) x = 5","C) x = 6","D) x = 7","C"]
,["Álgebra","Qual é o resultado de (x + 2)(x + 3)?","A) x² + 5x + 6","B) x² + 6x + 5","C) x² + 5x + 5","D) x² + 6x + 6","A"]
,["Álgebra","Qual é o valor de 2x² − 3x + 1 para x = 2?","A) 1","B) 2","C) 3","D) 4","C"]
,["Álgebra","Qual é a solução positiva de x² = 49?","A) 5","B) 6","C) 7","D) 8","C"]
,["Álgebra","Se f(x) = x² − 4, qual é f(3)?","A) 3","B) 5","C) 7","D) 9","B"]
,["Álgebra","Qual é a raiz da equação 7x + 14 = 0?","A) −3","B) −2","C) 2","D) 3","B"]
,["Álgebra","Qual é a expressão fatorada de x² + 7x + 12?","A) (x + 2)(x + 6)","B) (x + 3)(x + 4)","C) (x − 3)(x − 4)","D) (x + 1)(x + 12)","B"]
,["Geometria Plana","Qual é a área de um quadrado de lado 9 cm?","A) 18 cm²","B) 36 cm²","C) 72 cm²","D) 81 cm²","D"]
,["Geometria Plana","Um retângulo tem perímetro 30 cm e comprimento 10 cm. Qual é sua largura?","A) 4 cm","B) 5 cm","C) 6 cm","D) 8 cm","B"]
,["Geometria Plana","Qual é a área de um paralelogramo de base 12 cm e altura 7 cm?","A) 42 cm²","B) 72 cm²","C) 84 cm²","D) 96 cm²","C"]
,["Geometria Plana","Um triângulo equilátero tem lado 8 cm. Qual é seu perímetro?","A) 16 cm","B) 24 cm","C) 32 cm","D) 64 cm","B"]
,["Geometria Plana","Qual é a medida de cada ângulo interno de um quadrado?","A) 45°","B) 60°","C) 90°","D) 120°","C"]
,["Geometria Plana","Um losango tem diagonais de 10 cm e 6 cm. Qual é sua área?","A) 16 cm²","B) 30 cm²","C) 60 cm²","D) 120 cm²","B"]
,["Geometria Plana","Um círculo tem diâmetro 14 cm. Usando π = 3,14, qual é sua área?","A) 43,96 cm²","B) 87,92 cm²","C) 153,86 cm²","D) 307,72 cm²","C"]
,["Geometria Plana","Dois ângulos são complementares. Se um mede 35°, quanto mede o outro?","A) 45°","B) 55°","C) 65°","D) 145°","B"]
,["Geometria Espacial","Qual é a área total de um cubo de aresta 5 cm?","A) 25 cm²","B) 100 cm²","C) 125 cm²","D) 150 cm²","D"]
,["Geometria Espacial","Um paralelepípedo mede 8 cm de comprimento, 4 cm de largura e 3 cm de altura. Qual é seu volume?","A) 64 cm³","B) 96 cm³","C) 112 cm³","D) 128 cm³","B"]
,["Geometria Espacial","Qual é a área da base de um cilindro de raio 4 cm, usando π = 3,14?","A) 25,12 cm²","B) 37,68 cm²","C) 50,24 cm²","D) 100,48 cm²","C"]
,["Geometria Espacial","Uma caixa em forma de cubo tem volume de 216 cm³. Qual é a medida de sua aresta?","A) 4 cm","B) 5 cm","C) 6 cm","D) 8 cm","C"]
,["Geometria Espacial","Uma pirâmide tem área da base de 30 cm² e altura de 12 cm. Qual é seu volume?","A) 120 cm³","B) 180 cm³","C) 240 cm³","D) 360 cm³","B"]
,["Geometria Espacial","Um cone tem raio 5 cm e altura 6 cm. Usando π = 3,14, qual é seu volume?","A) 78,5 cm³","B) 157 cm³","C) 314 cm³","D) 471 cm³","C"]
,["Geometria Espacial","Qual é a área de uma esfera de raio 3 cm, usando π = 3,14?","A) 56,52 cm²","B) 84,78 cm²","C) 113,04 cm²","D) 169,56 cm²","C"]
];

let current=0, score=0, answers=[];
function render(){
 const q=questions[current];
 document.getElementById("app").innerHTML=`
 <h1>Quiz de Matemática</h1><div class="subtitle">60 questões • Aritmética • Álgebra • Geometria Plana • Geometria Espacial</div>
 <div class="progress"><div class="bar" style="width:${current/questions.length*100}%"></div></div>
 <span class="badge">${q[0]} — Questão ${current+1} de ${questions.length}</span>
 <div class="question">${q[1]}</div>
 <div id="opts">${q.slice(2,6).map((o,i)=>`<button class="option" onclick="select('${String.fromCharCode(65+i)}')">${o}</button>`).join("")}</div>
 <button class="next" id="next" disabled onclick="next()">Responder</button>`;
}
function select(v){
 answers[current]=v;
 document.querySelectorAll(".option").forEach((b,i)=>b.classList.toggle("selected",String.fromCharCode(65+i)===v));
 document.getElementById("next").disabled=false;
}
function next(){
 if(answers[current]===questions[current][6])score++;
 current++;
 if(current<questions.length)render(); else result();
}
function result(){
 const pct=Math.round(score/questions.length*100);
 let msg=pct>=80?"Excelente desempenho!":pct>=60?"Muito bom!":"Continue praticando!";
 let review=questions.map((q,i)=>`<div class="review-item ${answers[i]===q[6]?'correct':'wrong'}"><b>${i+1}. ${q[1]}</b><br>Sua resposta: ${answers[i]||"não respondida"} | Gabarito: ${q[6]}</div>`).join("");
 document.getElementById("app").innerHTML=`<div class="result"><h1>Resultado final</h1><div class="score">${score}/${questions.length}</div><h2>${pct}% de acertos</h2><p>${msg}</p><button class="next restart" onclick="location.reload()">Fazer novamente</button></div><div class="review"><h2>Revisão</h2>${review}</div>`;
}
render();
</script>
</body>
</html>
